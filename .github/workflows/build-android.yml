name: Build Android APK + AAB

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flet + deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install flet==1.0.5 flet-cli==1.0.5 httpx pypdf fpdf2 pillow
          pip install flet-camera==1.0.5 pyzbar

      - name: Export store assets
        run: python scripts/export_store_assets.py

      - name: Build APK
        run: flet build apk --module-name main --yes

      - name: Build AAB
        run: flet build aab --module-name main --yes

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nakitce-apk
          path: |
            build/apk/*.apk
            build/**/*.apk
          if-no-files-found: warn

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: nakitce-aab
          path: |
            build/aab/*.aab
            build/**/*.aab
          if-no-files-found: warn
