name: Build Android APK + AAB

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [apk, aab]
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flet + deps
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.0.5 flet-cli==1.0.5 flet-camera==1.0.5 httpx pypdf fpdf2 pillow pyzbar

      - name: Export store assets
        run: python scripts/export_store_assets.py

      - name: Build ${{ matrix.target }}
        run: flet build ${{ matrix.target }} --module-name main --yes

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nakitce-${{ matrix.target }}
          path: |
            build/${{ matrix.target }}/*.${{ matrix.target }}
            build/**/*.${{ matrix.target }}
          if-no-files-found: warn
