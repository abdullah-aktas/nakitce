name: Build iOS IPA

# iOS derlemesi yalnızca macOS + Apple Developer imzası ile yapılır.
# Repo secrets (App Store):
#   APPLE_TEAM_ID
#   APPLE_CERTIFICATE_BASE64
#   APPLE_CERTIFICATE_PASSWORD
#   APPLE_PROVISION_PROFILE_BASE64

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.0.5 flet-cli==1.0.5 flet-camera==1.0.5 httpx pypdf fpdf2 pillow pyzbar

      - name: Inject Apple Team ID when present
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "APPLE_TEAM_ID secret yok — imzasız/deneme derlemesi denenecek."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import os, re
          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          team = os.environ["APPLE_TEAM_ID"]
          if "team_id" not in text:
              text = text.replace(
                  'export_method = "app-store"',
                  f'team_id = "{team}"\nexport_method = "app-store"',
              )
          else:
              text = re.sub(r'team_id\s*=\s*".*"', f'team_id = "{team}"', text)
          path.write_text(text, encoding="utf-8")
          print("team_id injected")
          PY

      - name: Import signing materials when present
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "Sertifika secret yok — atlanıyor."
            exit 0
          fi
          CERT_PATH=$RUNNER_TEMP/dist.p12
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          KEYCHAIN=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          if [ -n "$APPLE_PROVISION_PROFILE_BASE64" ]; then
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            echo "$APPLE_PROVISION_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/nakitce.mobileprovision"
          fi

      - name: Build IPA
        run: flet build ipa --module-name main --yes

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nakitce-ipa
          path: |
            build/ipa/*.ipa
            build/**/*.ipa
          if-no-files-found: warn
