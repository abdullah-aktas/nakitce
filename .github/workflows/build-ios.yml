name: Build iOS IPA

# iOS derlemesi yalnızca macOS + Apple Developer imzası ile yapılır.
# Gerekli repo secrets (App Store dağıtımı için):
#   APPLE_TEAM_ID
#   APPLE_CERTIFICATE_BASE64   (Distribution .p12)
#   APPLE_CERTIFICATE_PASSWORD
#   APPLE_PROVISION_PROFILE_BASE64
#   APPLE_KEY_ID / APPLE_ISSUER_ID / APPLE_API_KEY_BASE64  (opsiyonel Notary/Transporter)

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.0.5 flet-cli==1.0.5 flet-camera==1.0.5 httpx pypdf fpdf2 pillow pyzbar

      - name: Inject Apple Team ID
        if: ${{ secrets.APPLE_TEAM_ID != '' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          team = os.environ["APPLE_TEAM_ID"]
          if "team_id" not in text:
              text = text.replace(
                  'export_method = "app-store"',
                  f'team_id = "{team}"\nexport_method = "app-store"',
              )
          else:
              import re
              text = re.sub(r'team_id\s*=\s*".*"', f'team_id = "{team}"', text)
          path.write_text(text, encoding="utf-8")
          PY
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Import signing certificate
        if: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/dist.p12
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          KEYCHAIN=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

      - name: Install provisioning profile
        if: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 != '' }}
        env:
          APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_PROVISION_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/nakitce.mobileprovision

      - name: Build IPA
        run: flet build ipa --module-name main --yes
        continue-on-error: true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: nakitce-ipa
          path: |
            build/ipa/*.ipa
            build/**/*.ipa
          if-no-files-found: warn

      - name: iOS note
        if: failure() || cancelled()
        run: |
          echo "iOS IPA için Apple Developer secrets gerekir."
          echo "Windows'ta IPA üretilemez; bu workflow macOS runner kullanır."
